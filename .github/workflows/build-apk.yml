name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android ফোল্ডার আলাদা জায়গায় বানিয়ে এনে বসানো হয়
      - name: Create Android scaffold
        run: |
          flutter create --org com.amarsokal24 --project-name amarsokal24_app --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Allow internet and set app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' $M
          sed -i 's/android:label="[^"]*"/android:label="আমার সকাল ২৪"/' $M

      # নোটিফিকেশনের জন্য: অনুমতি, Java desugaring, ও স্ট্যাটাস বারের আইকন
      - name: Setup notifications (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>/' $M
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = """<service android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmService" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false"/>
              <receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmBroadcastReceiver" android:exported="false"/>
              <receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.RebootBroadcastReceiver" android:enabled="false" android:exported="false">
                  <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
              </receiver>
          """
          s = s.replace('</application>', add + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/raw
          cat > android/app/src/main/res/drawable/ic_stat.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M19,3H5C3.9,3 3,3.9 3,5v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V5C21,3.9 20.1,3 19,3zM14,17H7v-2h7V17zM17,13H7v-2h10V13zM17,9H7V7h10V9z"/>
          </vector>
          XML
          cat > android/app/src/main/res/raw/keep.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@drawable/ic_stat,@mipmap/ic_launcher" />
          XML

      # flutter_local_notifications-এর জন্য Java desugaring: build.gradle ফাইলেই সরাসরি বসানো হয়
      - name: Patch build.gradle for desugaring
        run: |
          python3 - <<'PY'
          import re, os
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if not os.path.exists(f):
                  continue
              s = open(f, encoding='utf-8').read()
              kts = f.endswith('.kts')
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              dep = ('\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' if kts
                     else "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}\n")
              if re.search(r'compileOptions\s*\{', s):
                  s = re.sub(r'compileOptions\s*\{', lambda m: m.group(0) + '\n        ' + flag, s, count=1)
              else:
                  s = re.sub(r'android\s*\{', lambda m: m.group(0) + '\n    compileOptions {\n        ' + flag + '\n    }', s, count=1)
              s += dep
              open(f, 'w', encoding='utf-8').write(s)
              print('PATCHED', f)
              print(s)
          PY

      # flutter_local_notifications-এর জন্য Java desugaring (ফাইল না বদলে Gradle init স্ক্রিপ্টে চালু করা হয়)
      - name: Enable core library desugaring
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/desugar.gradle <<'EOF2'
          allprojects { p ->
            p.plugins.withId('com.android.application') {
              p.android.compileOptions.coreLibraryDesugaringEnabled = true
              p.dependencies.add('coreLibraryDesugaring', 'com.android.tools:desugar_jdk_libs:2.1.5')
            }
          }
          EOF2

      # স্থায়ী release key দিয়ে সাইন (GitHub Secrets থেকে) — যাতে প্রতিটি আপডেট আগের অ্যাপের ওপর ইনস্টল হয়
      - name: Setup permanent release signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS_SECRET" ]; then
            echo "ERROR: GitHub Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD সেট করা নেই।"; exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
          echo "KS_ALIAS=amarsokal24" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re, sys
          done = False
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if not os.path.exists(f):
                  continue
              s = open(f, encoding='utf-8').read()
              kts = f.endswith('.kts')
              if kts:
                  block = ('signingConfigs {\n        create("release") {\n'
                           '            storeFile = file(System.getenv("KS_PATH"))\n'
                           '            storePassword = System.getenv("KS_PASS")\n'
                           '            keyAlias = System.getenv("KS_ALIAS")\n'
                           '            keyPassword = System.getenv("KS_PASS")\n'
                           '        }\n    }\n    ')
                  s, n = re.subn(r'signingConfigs\.getByName\("debug"\)', 'signingConfigs.getByName("release")', s)
              else:
                  block = ('signingConfigs {\n        release {\n'
                           '            storeFile file(System.getenv("KS_PATH"))\n'
                           '            storePassword System.getenv("KS_PASS")\n'
                           '            keyAlias System.getenv("KS_ALIAS")\n'
                           '            keyPassword System.getenv("KS_PASS")\n'
                           '        }\n    }\n    ')
                  s, n = re.subn(r'signingConfig\s*=?\s*signingConfigs\.debug', 'signingConfig signingConfigs.release', s)
              if n == 0:
                  print('ERROR: debug signingConfig line not found in', f); sys.exit(1)
              s, m = re.subn(r'(\n\s*)buildTypes\s*\{', lambda mo: mo.group(1) + block.rstrip(' ') + mo.group(1).lstrip('\n') + 'buildTypes {', s, count=1)
              if m == 0:
                  print('ERROR: buildTypes not found in', f); sys.exit(1)
              open(f, 'w', encoding='utf-8').write(s)
              print('SIGNING PATCHED', f); print(s); done = True
          if not done:
              print('ERROR: no build.gradle found'); sys.exit(1)
          PY

      - run: flutter pub get

      # Android lint টুলের বাগ (webview প্যাকেজে) এড়াতে lint বন্ধ রাখা
      - name: Disable Android lint tasks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith("lintVital") || t.name.startsWith("lintAnalyze") || t.name.startsWith("lintReport")) {
                t.enabled = false
              }
            }
          }
          EOF

      # অ্যাপ আইকন (assets/icon/icon.png) বসানো
      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - name: Show APK signing fingerprint
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: amarsokal24-apk
          path: build/app/outputs/flutter-apk/app-release.apk
