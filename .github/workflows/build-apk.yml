name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --org com.amarsokal24 --project-name amarsokal24_app --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Allow internet and set app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' $M
          sed -i 's/android:label="[^"]*"/android:label="আমার সকাল ২৪"/' $M

      - run: flutter pub get

      - name: Disable Android lint tasks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith("lintVital") || t.name.startsWith("lintAnalyze") || t.name.startsWith("lintReport")) {
                t.enabled = false
              }
            }
          }
          EOF

      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: amarsokal24-apk
          path: build/app/outputs/flutter-apk/app-release.apk
