name: amarsokal24_app
description: আমার সকাল ২৪ নিউজ অ্যাপ
publish_to: 'none'
version: 1.15.6+24

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  flutter_local_notifications: ^19.0.0
  android_alarm_manager_plus: ^4.0.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  open_filex: ^4.5.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  html: 0.15.4

# অ্যাপ আইকন: assets/icon/ এর ছবি থেকে বিল্ডের সময় নিজে থেকে বসে (build-apk.yml দেখুন)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/partners/
  fonts:
    - family: Kalpurush
      fonts:
        - asset: assets/Kalpurush.ttf
