name: amarsokal24_app
description: আমার সকাল ২৪ নিউজ অ্যাপ
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

# অ্যাপ আইকন: assets/icon/ এর ছবি থেকে বিল্ডের সময় নিজে থেকে বসে (build-apk.yml দেখুন)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
